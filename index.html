<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7a75">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Apoio Aula 12 / Momento de Inércia</title>
<style>
:root{--bg:#f3f6f2;--board:#fdfdfb;--ink:#17262b;--mute:#586a6e;--acc:#0b7a75;--hi:#a8500a;--line:#d3dcd7;--res:#e1f1e7;--chip:#e6ede9;
--why-bg:#e3f1ef;--why-bd:#0b7a75;--err-bg:#fbe9e2;--err-bd:#b3411f;--real-bg:#e8eefb;--real-bd:#3b5bb5;--tip-bg:#fff2d2;--tip-bd:#a67a00;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1919;--board:#1a2a28;--ink:#eeeadc;--mute:#9db1ab;--acc:#7fd0d6;--hi:#f2c14e;--line:#2e4642;--res:#23402e;--chip:#223633;--why-bg:#173433;--why-bd:#7fd0d6;--err-bg:#3d231c;--err-bd:#f08a6c;--real-bg:#1d2740;--real-bd:#8fb0ff;--tip-bg:#3a3118;--tip-bd:#f2c14e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1919;--board:#1a2a28;--ink:#eeeadc;--mute:#9db1ab;--acc:#7fd0d6;--hi:#f2c14e;--line:#2e4642;--res:#23402e;--chip:#223633;--why-bg:#173433;--why-bd:#7fd0d6;--err-bg:#3d231c;--err-bd:#f08a6c;--real-bg:#1d2740;--real-bd:#8fb0ff;--tip-bg:#3a3118;--tip-bd:#f2c14e;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--board)}
.logo{height:34px;width:auto;background:#fff;border-radius:8px;padding:4px 8px;flex:0 0 auto}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font:700 1.05rem/1.2 Georgia,"Times New Roman",serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{display:block;color:var(--mute);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{display:flex;gap:8px;flex:0 0 auto}
.tb button{border:1px solid var(--acc);background:transparent;color:var(--acc);padding:7px 12px;border-radius:999px;font:600 .85rem system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.hd2{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 14px 0;flex-wrap:wrap}
.hd2 h2{margin:0;font:700 1.05rem/1.3 Georgia,serif;color:var(--acc)}
.badge{font:700 .68rem/1 system-ui,sans-serif;letter-spacing:.06em;padding:4px 8px;border-radius:999px;color:#fff;text-transform:uppercase}
.b-bas{background:#2e7d32}.b-int{background:#b36b00}.b-ava{background:#b3261e}.b-ded{background:#3b5bb5}.b-ger{background:#0b7a75}
#cnt{color:var(--mute);font-size:.9rem;margin-left:auto}
#dots{flex:0 0 auto;display:flex;gap:5px;padding:8px 14px 8px}
#dots button{flex:1;height:8px;border:0;border-radius:4px;background:var(--line);cursor:pointer;padding:0}
#dots button.on{background:var(--acc)}
#dots button.cur{background:var(--hi)}
.stage{flex:1;min-height:0;position:relative;margin:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--board);overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none}
.sl{--base:clamp(15px,min(2.05vw,3.3vh),30px);font-size:calc(var(--base) * var(--k,1));height:100%;overflow:auto;padding:1.1em 1.4em;display:grid;grid-template-columns:1fr;gap:1em;align-content:center;animation:fade .18s ease}
@keyframes fade{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sl{animation:none}}
@media (min-width:760px) and (min-aspect-ratio:1/1){.sl.two{grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr);align-items:center}}
.side{min-width:0;display:flex;flex-direction:column;gap:.6em}
.main{min-width:0}
.fig{display:block;width:100%;max-width:22em;height:auto;margin:0 auto}
@media (max-width:759px),(max-aspect-ratio:1/1){.fig{max-height:20vh;max-width:15em}.trail{display:none}}
.fig .b{fill:var(--chip);stroke:var(--acc);stroke-width:2}
.fig .o{fill:none;stroke:var(--acc);stroke-width:7}
.fig .ring{fill:none;stroke:var(--hi);stroke-width:8}
.fig .e{fill:var(--hi)}
.fig .x{stroke:var(--hi);stroke-width:1.6;stroke-dasharray:5 4;fill:none}
.fig .l{stroke:var(--ink);stroke-width:1.2;fill:none}
.fig .ar{stroke:var(--hi);stroke-width:2;fill:none}
.fig .gr{fill:var(--line);stroke:var(--mute);stroke-width:1.5}
.fig text{fill:var(--ink);font:italic 14px Georgia,"Times New Roman",serif}
.fig text.t{font:12px system-ui,sans-serif;fill:var(--mute)}
.trail{border-top:1px dashed var(--line);padding-top:.5em;font:.85em/1.5 "Cambria Math","STIX Two Math",Georgia,serif;color:var(--mute)}
.trail small{display:block;font:.85em system-ui,sans-serif;margin-bottom:.2em}
.trail div{white-space:nowrap;overflow:hidden}
.rot{display:flex;gap:.4em;flex-wrap:wrap;margin-bottom:.7em}
.rot span{font:600 .55em/1 system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:.5em .8em;border-radius:999px;background:var(--chip);color:var(--mute);border:1px solid var(--line)}
.rot span.on{background:var(--acc);color:var(--board);border-color:var(--acc)}
.st{font:700 1.2em/1.3 system-ui,sans-serif;margin:0 0 .45em}
.enun{font:1em/1.55 system-ui,sans-serif;border-left:4px solid var(--acc);padding:.2em 0 .2em .9em;margin:0 0 .5em}
.eq{font:1.3em/1.75 "Cambria Math","STIX Two Math",Georgia,"Times New Roman",serif;background:var(--bg);border-left:4px solid var(--hi);border-radius:6px;padding:.35em .8em;margin:0 0 .6em;overflow-x:auto;overflow-y:hidden}
.eq div{white-space:nowrap}
.res .eq,.eq.res{border-color:var(--acc);background:var(--res);text-align:center;font-size:1.55em}
.eq .hl,.hl{color:var(--hi);font-weight:700}
ul.lst{margin:0 0 .6em;padding-left:1.2em;font-size:.95em;line-height:1.55}
ul.lst li{margin:.3em 0}
table.tb2{border-collapse:collapse;margin:0 0 .6em;font:.95em/1.5 "Cambria Math",Georgia,serif;width:100%}
table.tb2 th,table.tb2 td{border:1px solid var(--line);padding:.25em .6em;text-align:center}
table.tb2 th{background:var(--chip);font:700 .85em system-ui,sans-serif}
.co{border-left:5px solid;border-radius:8px;padding:.45em .8em;margin:.45em 0 0;font-size:.82em;line-height:1.5}
.co b{display:block;font:700 .78em system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;margin-bottom:.15em}
.co.why{background:var(--why-bg);border-color:var(--why-bd)}.co.why b{color:var(--why-bd)}
.co.err{background:var(--err-bg);border-color:var(--err-bd)}.co.err b{color:var(--err-bd)}
.co.real{background:var(--real-bg);border-color:var(--real-bd)}.co.real b{color:var(--real-bd)}
.co.tip{background:var(--tip-bg);border-color:var(--tip-bd)}.co.tip b{color:var(--tip-bd)}
/* matemática */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.2}
.fr .nu{border-bottom:.07em solid currentColor;padding:0 .2em .05em}
.fr .de{padding:.05em .2em 0}
.fr .fr{font-size:.85em}
.sq{display:inline-flex;align-items:stretch}
.sq .rb{border-top:.07em solid currentColor;padding:0 .12em;margin-top:.08em}
.par{position:relative;display:inline-block;vertical-align:middle;padding:0 .5em}
.par::before,.par::after{content:"";position:absolute;top:-.05em;bottom:-.05em;width:.3em;border:.08em solid currentColor}
.par::before{left:0;border-right:0;border-radius:.9em 0 0 .9em/50% 0 0 50%}
.par::after{right:0;border-left:0;border-radius:0 .9em .9em 0/0 50% 50% 0}
.ev{display:inline-flex;align-items:stretch;vertical-align:middle}
.ev .evb{position:relative;padding:0 .45em;display:inline-block}
.ev .evb::before,.ev .evb::after{content:"";position:absolute;top:0;bottom:0;width:.22em;border:.08em solid currentColor}
.ev .evb::before{left:0;border-right:0}.ev .evb::after{right:0;border-left:0}
.int{display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 .1em}
.int .isy{font-size:1.7em;line-height:.9;align-self:center}
.lim{display:inline-flex;flex-direction:column;justify-content:space-between;font-size:.6em;line-height:1.1;margin-left:.1em;text-align:left}
.ss{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.62em;line-height:1.05;margin-left:.05em}
sub,sup{line-height:0}
.ctl{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px}
.ctl button{flex:1;padding:.7em;border-radius:12px;border:1px solid var(--acc);background:transparent;color:var(--acc);font:700 1.15rem system-ui,sans-serif;cursor:pointer}
.ctl button.main{background:var(--acc);color:var(--board)}
.ctl button:disabled{opacity:.35;cursor:default}
.hint{flex:0 0 auto;color:var(--mute);font-size:.75rem;text-align:center;max-width:14em}
@media (max-width:700px){.hint{display:none}.ttl{display:none}.bar{justify-content:space-between}.eq div{white-space:normal}.tb button{padding:6px 9px}}
body.pres .bar,body.pres .hd2{display:none}
body.pres .stage{margin:0;border-radius:0;border:0}
body.pres .ctl{position:absolute;left:0;right:0;bottom:0;padding:6px 14px;opacity:.55}
body.pres .ctl:hover,body.pres .ctl:focus-within{opacity:1}
body.pres #dots{padding:6px 14px 2px}
#idx{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#idx[hidden]{display:none}
.panel{background:var(--board);border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:16px 18px}
.panel h3{margin:.4em 0 .5em;font:700 1.05rem Georgia,serif;color:var(--acc)}
.panel .g{display:flex;flex-wrap:wrap;gap:8px}
.panel .g button{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:9px 13px;border-radius:10px;font:600 .95rem system-ui,sans-serif;cursor:pointer;text-align:left}
.panel .g button.cur{background:var(--acc);border-color:var(--acc);color:var(--board)}
.panel .x{float:right;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600}

/* ===== celular ===== */
.stage{touch-action:pan-y}
button{touch-action:manipulation}
.lb{display:inline}
.rot span::before{content:none}
.wd{margin:.2em 0 .6em}
.wd .row{display:grid;grid-template-columns:5.2em 1fr 4.6em;gap:.5em;align-items:center;margin:.25em 0;font-size:.9em}
.wd .row b{font-weight:700}
.wd input[type=range]{width:100%;height:2.2em;accent-color:var(--acc)}
.wd .out{background:var(--bg);border-left:4px solid var(--hi);border-radius:6px;padding:.45em .8em;margin:.5em 0;font:1.05em/1.6 "Cambria Math",Georgia,serif}
.wd .bar2{display:flex;height:1.6em;border-radius:8px;overflow:hidden;margin:.4em 0;font:700 .7em system-ui,sans-serif;color:#fff}
.wd .bar2 i{display:flex;align-items:center;justify-content:center;font-style:normal;min-width:0;white-space:nowrap}
.wd svg{display:block;width:100%;height:auto;max-height:26vh;margin:0 auto}
.wd svg text{fill:var(--ink);font:italic 12px Georgia,serif}
.wd svg .gh{fill:var(--hi)}.wd svg .ax{stroke:var(--hi);stroke-width:1.6;stroke-dasharray:5 4}.wd svg .ln{stroke:var(--ink);stroke-width:1.2}
.rbox{position:relative;height:clamp(220px,33vh,300px);overflow:hidden;border:1px solid var(--line);border-radius:12px;background:linear-gradient(var(--bg),var(--board))}
.ramp{position:absolute;left:4%;top:6%;width:84%;transform-origin:0 0;transition:transform .2s}
.ramp .ln{position:relative;height:2.4em;margin-bottom:.15em;background:var(--chip);border-bottom:3px solid var(--mute);border-radius:3px}
.ramp .ln .nm{position:absolute;left:38%;top:.1em;font:600 .62em system-ui,sans-serif;color:var(--mute)}
.ramp .bd{position:absolute;left:0;bottom:0;width:2.1em;height:2.1em;border-radius:50%;border:2px solid var(--acc);background:var(--board)}
.ramp .bd.ring{border-width:.42em;background:transparent}
.ramp .bd.sph{background:radial-gradient(circle at 35% 30%,var(--board),var(--acc))}
.ramp .bd::after{content:"";position:absolute;left:50%;top:6%;width:2px;height:44%;background:var(--hi);transform:translateX(-50%)}
.rctl{display:flex;gap:.6em;align-items:center;margin:.5em 0;flex-wrap:wrap}
.rctl label{flex:1 1 9em;font-size:.9em}
.rctl button{padding:.6em 1em;border-radius:12px;border:1px solid var(--acc);background:var(--acc);color:var(--board);font:700 1em system-ui,sans-serif;cursor:pointer}
.rctl button.g{background:transparent;color:var(--acc)}
.rtimes{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em;font-size:.85em;text-align:center}
.rtimes div{border:1px solid var(--line);border-radius:10px;padding:.35em;background:var(--chip)}
.rtimes div.w{border-color:var(--hi);background:var(--tip-bg)}
@media (min-width:760px) and (min-aspect-ratio:1/1){.rbox{height:clamp(240px,44vh,360px)}.wd.in{display:grid;grid-template-columns:1fr 1fr;gap:1.2em;align-items:center}}
@media (max-width:700px),(max-aspect-ratio:1/1){
 .app{--pad:8px}
 .sl{--base:clamp(16px,4.5vw,20px);padding:.8em .9em;gap:.7em;align-content:start}
 .stage{margin:0 8px;border-radius:12px}
 .bar{padding:6px 10px;gap:8px}
 .logo{height:28px}
 .tb{margin-left:auto;gap:6px}
 .tb button{padding:8px 12px;font-size:1rem;min-width:44px;min-height:40px}
 .lb{display:none}
 .hd2{padding:6px 12px 0;gap:8px}
 .hd2 h2{font-size:.95rem}
 #cnt{font-size:.78rem}
 #dots{padding:6px 12px}
 #dots button{height:9px}
 .fig{max-height:30vh;max-width:100%;width:auto}
 .fig text{font-size:15px}
 .rot{flex-wrap:nowrap;gap:4px;margin-bottom:.5em}
 .rot span{flex:0 0 auto;font-size:.5em;padding:.6em .8em}
 .rot span:not(.on){font-size:0;padding:0;display:inline-flex;align-items:center;justify-content:center;width:1.9rem;height:1.9rem;border-radius:50%}
 .rot span:not(.on)::before{content:attr(data-n);font-size:.62rem}
 .st{font-size:1.15em}
 .eq{font-size:1.2em;padding:.3em .6em;line-height:1.7}
 .res .eq,.eq.res{font-size:1.35em}
 .co{font-size:.88em}
 ul.lst,table.tb2{font-size:.92em}
 .ctl{padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));gap:8px}
 .ctl button{min-height:56px;font-size:1.05rem;border-radius:14px;flex:1 1 0}
 .ctl #next{flex:2 1 0}
 .ctl #prev{flex:1 1 0}
 .ctl #prev{font-size:0}.ctl #prev::before{content:"←";font-size:1.6rem}
 #idx{align-items:flex-end;padding:0}
 .panel{max-width:none;border-radius:16px 16px 0 0;max-height:80vh;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
 .panel .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .panel .g button{padding:12px;font-size:.9rem;min-height:48px}
}
@media (max-height:520px){
 .bar{padding:3px 10px}.ttl{display:none}.logo{height:22px}
 .hd2{padding-top:2px}.hd2 h2{font-size:.85rem}
 .stage{margin:0 8px}
 .sl{--base:clamp(13px,3.6vh,18px)}
 .ctl{padding:4px 10px}.ctl button{min-height:40px;padding:.3em}
 #dots{padding:3px 12px}
 .rbox{height:56vh}
}

/* ===== botões de navegação sutis ===== */
.ctl{position:fixed !important;left:0;right:0;bottom:0;padding:0 18px calc(14px + env(safe-area-inset-bottom,0px)) !important;justify-content:space-between;pointer-events:none;background:none !important;z-index:6}
.ctl button,.ctl #prev,.ctl #next{pointer-events:auto;flex:0 0 auto !important;width:42px !important;height:42px !important;min-height:0 !important;padding:0 !important;border-radius:50% !important;font:400 1.7rem/1 system-ui,sans-serif !important;display:flex;align-items:center;justify-content:center;border:1px solid var(--line) !important;background:var(--board) !important;color:var(--mute) !important;opacity:.35;transition:opacity .15s}
.ctl button::before{content:none !important}
.ctl button:hover,.ctl button:focus-visible,.ctl button:active{opacity:.95}
.ctl button:disabled{opacity:.12 !important}
.stage{margin-bottom:10px}
.sl{padding-bottom:3.2em}
body.pres .ctl{position:fixed !important;opacity:1}
body.pres .stage{margin-bottom:0}
</style>
</head>
<body>

<script>
/* ===== Renderizador de matemática: \f{a}{b} fração · \r{a} raiz · \h{a} destaque · \p{a} parênteses altos
   \e{expr}{inf}{sup} colchete avaliado · \I{inf}{sup} integral · ^{x} _{x} (ambos juntos empilham) ===== */
function grp(s,i){let dep=0,j=i;for(;j<s.length;j++){if(s[j]==='{')dep++;else if(s[j]==='}'){dep--;if(dep===0)break}}return [s.slice(i+1,j),j+1]}
const ESC={'<':'&lt;','>':'&gt;','&':'&amp;'};
function fx(s){
  let o='',i=0;
  while(i<s.length){
    const c=s[i];
    if(c==='\\'){
      const k=s[i+1];
      if(k==='f'){const [a,j]=grp(s,i+2),[b,j2]=grp(s,j);o+='<span class="fr"><span class="nu">'+fx(a)+'</span><span class="de">'+fx(b)+'</span></span>';i=j2;continue}
      if(k==='r'){const [a,j]=grp(s,i+2);o+='<span class="sq">√<span class="rb">'+fx(a)+'</span></span>';i=j;continue}
      if(k==='h'){const [a,j]=grp(s,i+2);o+='<span class="hl">'+fx(a)+'</span>';i=j;continue}
      if(k==='p'){const [a,j]=grp(s,i+2);o+='<span class="par">'+fx(a)+'</span>';i=j;continue}
      if(k==='e'){const [a,j]=grp(s,i+2),[lo,j2]=grp(s,j),[hi,j3]=grp(s,j2);o+='<span class="ev"><span class="evb">'+fx(a)+'</span><span class="lim"><i>'+fx(hi)+'</i><i>'+fx(lo)+'</i></span></span>';i=j3;continue}
      if(k==='I'){const [lo,j]=grp(s,i+2),[hi,j2]=grp(s,j);o+='<span class="int"><span class="isy">∫</span><span class="lim"><i>'+fx(hi)+'</i><i>'+fx(lo)+'</i></span></span>';i=j2;continue}
    }
    if((c==='^'||c==='_')&&s[i+1]==='{'){
      const [a,j]=grp(s,i+1),c2=c==='^'?'_':'^';
      if(s[j]===c2&&s[j+1]==='{'){const [b,j2]=grp(s,j+1);const sup=c==='^'?a:b,sub=c==='^'?b:a;o+='<span class="ss"><i>'+fx(sup)+'</i><i>'+fx(sub)+'</i></span>';i=j2;continue}
      o+=(c==='^'?'<sup>':'<sub>')+fx(a)+(c==='^'?'</sup>':'</sub>');i=j;continue;
    }
    o+=ESC[c]||c;i++;
  }
  return o;
}
const lines=a=>a.map(l=>'<div>'+fx(l)+'</div>').join('');
/* ===== figuras ===== */
const SV=b=>'<svg class="fig" viewBox="0 0 300 130" role="img" aria-label="Ilustração">'+b+'</svg>';
const T=(x,y,s,c)=>'<text x="'+x+'" y="'+y+'"'+(c?' class="'+c+'"':'')+' text-anchor="middle">'+s+'</text>';
const DOT=(x,y,c)=>'<circle cx="'+x+'" cy="'+y+'" r="4" fill="'+c+'"/>';

const HD='<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--hi)"/></marker></defs>';
const AR=(x1,y1,x2,y2)=>'<path class="ar" d="M'+x1+' '+y1+'L'+x2+' '+y2+'" marker-end="url(#ah)"/>';

const RAMP='<path class="gr" d="M20 30L270 110L20 110Z"/><path class="l" d="M20 30V110M12 30H28M12 110H28"/>'+T(8,74,'h')+'<path class="l" d="M250 110A20 20 0 0 0 251 104"/>'+T(236,104,'θ');

/* ===== simuladores (funcionam por toque no celular) ===== */
const nf=(n,d=2)=>n.toFixed(d).replace('.',',');
const WID={
inertia(w){
  w.classList.add('in');
  w.innerHTML='<div class="vis"><svg viewBox="0 0 300 80" aria-label="Duas partículas no eixo"></svg><div class="bar2" id="wb"></div><div class="out" id="wo"></div></div><div class="sliders">'
   +'<div class="row"><b>m₁</b><input type="range" id="m1" min="1" max="5" step="0.5" value="2"><span id="v_m1"></span></div>'
   +'<div class="row"><b>r₁</b><input type="range" id="r1" min="0.1" max="1" step="0.05" value="0.5"><span id="v_r1"></span></div>'
   +'<div class="row"><b>m₂</b><input type="range" id="m2" min="1" max="5" step="0.5" value="3"><span id="v_m2"></span></div>'
   +'<div class="row"><b>r₂</b><input type="range" id="r2" min="0.1" max="1" step="0.05" value="0.8"><span id="v_r2"></span></div></div>';
  const g=id=>w.querySelector('#'+id),v=id=>+g(id).value;
  function up(){
    const m1=v('m1'),r1=v('r1'),m2=v('m2'),r2=v('r2'),I1=m1*r1*r1,I2=m2*r2*r2,I=I1+I2;
    g('v_m1').textContent=nf(m1,1)+' kg';g('v_m2').textContent=nf(m2,1)+' kg';g('v_r1').textContent=nf(r1)+' m';g('v_r2').textContent=nf(r2)+' m';
    const X=r=>30+r*250;
    w.querySelector('svg').innerHTML='<line class="ax" x1="30" y1="6" x2="30" y2="74"/><line class="ln" x1="30" y1="40" x2="'+Math.max(X(r1),X(r2))+'" y2="40"/>'
      +'<circle class="gh" cx="'+X(r1)+'" cy="40" r="'+(5+m1*2.4)+'" opacity=".85"/><circle class="gh" cx="'+X(r2)+'" cy="40" r="'+(5+m2*2.4)+'" fill="var(--acc)"/>'
      +'<text x="'+X(r1)+'" y="14" text-anchor="middle">m₁</text><text x="'+X(r2)+'" y="76" text-anchor="middle">m₂</text><text x="36" y="12">eixo</text>';
    g('wb').innerHTML='<i style="width:'+(I1/I*100)+'%;background:var(--hi)">I₁ '+nf(I1/I*100,0)+'%</i><i style="width:'+(I2/I*100)+'%;background:var(--acc)">I₂ '+nf(I2/I*100,0)+'%</i>';
    g('wo').innerHTML='I₁ = '+nf(m1,1)+'·'+nf(r1)+'² = '+nf(I1)+'<br>I₂ = '+nf(m2,1)+'·'+nf(r2)+'² = '+nf(I2)+'<br><b style="color:var(--hi)">I = '+nf(I)+' kg·m²</b><br><small style="font:.8em system-ui">m₂ tem '+nf(m2/(m1+m2)*100,0)+'% da massa e '+nf(I2/I*100,0)+'% do I</small>';
  }
  w.querySelectorAll('input').forEach(x=>x.oninput=up);up();
},
race(w){
  const C=[['anel',1,'ring'],['disco',.5,''],['esfera',.4,'sph']];
  w.innerHTML='<div class="rbox"><div class="ramp" id="rp">'+C.map(c=>'<div class="ln"><span class="nm">'+c[0]+' · c = '+(c[1]===1?'1':c[1]===.5?'½':'⅖')+'</span><div class="bd '+c[2]+'"></div></div>').join('')+'</div></div>'
   +'<div class="rctl"><label>Ângulo da rampa: <b id="ra">20</b>°<input type="range" id="rs" min="10" max="40" value="20"></label><button id="rg" type="button">▶ Soltar</button><button id="rl" class="g" type="button">🐢 Lento: sim</button></div>'
   +'<div class="rtimes" id="rt"></div>';
  const rb=w.querySelector('.rbox'),rp=w.querySelector('#rp'),bds=[...rp.querySelectorAll('.bd')];let slow=true;
  const set=()=>{const th=+w.querySelector('#rs').value;w.querySelector('#ra').textContent=th;rp.style.transform='rotate('+th+'deg)';return th};
  function reset(){cancelAnimationFrame(RAF);bds.forEach(b=>{b.style.left='0px';b.style.transform='rotate(0deg)'});w.querySelector('#rt').innerHTML=C.map(c=>'<div>'+c[0]+'<br>—</div>').join('')}
  w.querySelector('#rs').oninput=()=>{set();reset()};
  w.querySelector('#rl').onclick=e=>{slow=!slow;e.target.textContent='🐢 Lento: '+(slow?'sim':'não')};
  w.querySelector('#rg').onclick=()=>{
    reset();const th=set()*Math.PI/180,g=9.8,L=2.0;
    const a=C.map(c=>g*Math.sin(th)/(1+c[1])),T=a.map(x=>Math.sqrt(2*L/x));
    const len=rp.clientWidth-bds[0].offsetWidth,rad=bds[0].offsetWidth/2,f=slow?0.5:1,t0=performance.now();
    function fr(now){
      const t=(now-t0)/1000*f;let all=true;
      bds.forEach((b,k)=>{const x=Math.min(.5*a[k]*t*t,L);if(x<L)all=false;const px=x/L*len;b.style.left=px+'px';b.style.transform='rotate('+(px/rad*57.3)+'deg)'});
      if(!all)RAF=requestAnimationFrame(fr);
      else{const ord=T.map((t,k)=>k).sort((p,q)=>T[p]-T[q]);
        w.querySelector('#rt').innerHTML=C.map((c,k)=>'<div'+(ord[0]===k?' class="w"':'')+'>'+['🥇','🥈','🥉'][ord.indexOf(k)]+' '+c[0]+'<br>'+nf(T[k])+' s</div>').join('')}
    }
    RAF=requestAnimationFrame(fr);
  };
  const rw=Math.max(160,Math.min(rb.clientWidth*.84,(rb.clientHeight-100)/Math.sin(40*Math.PI/180)));rp.style.width=rw+'px';rp.style.left=Math.max(8,(rb.clientWidth-rw)/2)+'px';
  set();reset();
}};

{g:'Lista 12',name:'Q01 · Definição e partículas',badge:'Básico',bc:'b-bas',rot:true,fig:FQ1,steps:[
 {k:'enun',t:'Enunciado',enun:R`Defina \h{momento de inércia} e explique por que ele depende não apenas da massa total, mas também de \h{como a massa está distribuída} em relação ao eixo. Em seguida, calcule I de duas partículas: \h{m₁ = 2,0 kg} a \h{0,50 m} e \h{m₂ = 3,0 kg} a \h{0,80 m} do eixo.`,
  why:R`Duas partes: uma explicação (conceito) e uma conta. Leia as duas antes de começar.`},
 {k:'dados',t:'O que é dado e o que se pede',eq:[R`m_{1} = 2,0 kg  em  r_{1} = 0,50 m`,R`m_{2} = 3,0 kg  em  r_{2} = 0,80 m`,R`I = ?   (em kg·m^{2})`],
  why:R`Tudo já está no SI (kg e m); não há conversão a fazer.`,err:R`Se a prova der cm ou g, converta antes: 50 cm = 0,50 m.`},
 {k:'ferr',t:'Definição de momento de inércia',eq:[R`I = ∑ m_{i} r_{i}^{2}`,R`unidade: kg·m^{2}`],
  why:R`I mede a \h{resistência de um corpo a mudar sua rotação} em torno de um eixo. É a "massa da rotação": quanto maior I, mais torque é preciso para a mesma aceleração angular (τ = Iα).`,
  real:R`Patinador girando: braços abertos, I grande, gira devagar. Braços fechados, I pequeno, gira rápido.`},
 {k:'ferr',t:'Por que a distribuição importa? (veja as deduções)',eq:[R`Anel:  I = MR^{2}        Disco:  I = \f{1}{2}MR^{2}`,R`Haste, eixo no centro:  I = \f{ML^{2}}{12}`,R`Haste, eixo na ponta:  I = \f{ML^{2}}{3}  (4 vezes maior)`],
  why:R`Cada partícula contribui com m·r²: a distância entra \h{ao quadrado}. Mesmo M e R, o anel (massa toda na borda) tem o dobro de I do disco. Mesma haste, mesma massa: levar o eixo do centro para a ponta multiplica I por 4.`,
  real:R`Em um rotor de motor, massa longe do eixo demora mais para acelerar e para parar.`},
 {k:'conta',t:'Partícula 1',eq:[R`I_{1} = m_{1} r_{1}^{2}`,R`I_{1} = 2,0 · (0,50)^{2} = 2,0 · 0,25 = 0,50 kg·m^{2}`],why:R`Eleve a distância ao quadrado antes de multiplicar pela massa: 0,50² = 0,25.`},
 {k:'conta',t:'Partícula 2',eq:[R`I_{2} = m_{2} r_{2}^{2}`,R`I_{2} = 3,0 · (0,80)^{2} = 3,0 · 0,64 = 1,92 kg·m^{2}`],why:R`0,80² = 0,64. Esta partícula está mais longe e pesa mais, então domina a soma.`},
 {k:'res',t:'Somar',eq:[R`I = I_{1} + I_{2} = 0,50 + 1,92`,R`\h{I = 2,42 kg·m^{2}}`],why:R`Momentos de inércia em torno do mesmo eixo \h{se somam}. É uma soma de escalares, sem direção.`},
 {k:'conf',t:'A distância pesa mais que a massa',eq:[R`massa em m₂:  \f{3,0}{5,0} = 60%`,R`I em m₂:  \f{1,92}{2,42} ≈ 79%`,R`troca de posições:  2,0·0,64 + 3,0·0,25 = 2,03 kg·m^{2}`],
  why:R`m₂ tem 60% da massa e quase 80% do I. Trocando só as posições, I cai de 2,42 para 2,03: mesma massa, outra distribuição, outro I.`,
  err:R`Somar as massas e usar uma distância média (5,0 · 0,65² ≈ 2,11) ou esquecer o quadrado (2,0·0,5 + 3,0·0,8 = 3,4).`},
 {k:'sim',t:'Teste você: mexa nas massas e nas distâncias',widget:'inertia',why:R`Arraste os controles. Dobrar a distância quadruplica a contribuição de uma partícula; dobrar a massa só dobra. Volte a 2,0 kg / 0,50 m e 3,0 kg / 0,80 m para reencontrar 2,42.`,real:R`É o que o projetista faz ao escolher onde colocar o contrapeso de um rotor: pequenas mudanças de distância mudam muito o I.`}
]},
{g:'Lista 12',name:'Q02 · Disco: I e energia',badge:'Básico',bc:'b-bas',rot:true,fig:FQ2,steps:[
 {k:'enun',t:'Enunciado',enun:R`Disco sólido homogêneo de \h{M = 4,0 kg} e \h{R = 0,30 m} gira em torno do eixo central com \h{ω = 10 rad/s}. Com a fórmula tabelada \h{I = ½MR²}, calcule: (a) o momento de inércia; (b) a energia cinética de rotação.`},
 {k:'dados',t:'Dados',eq:[R`M = 4,0 kg,   R = 0,30 m,   ω = 10 rad/s`,R`pedem:  (a) I   (b) K_{rot}`],why:R`ω já está em rad/s, a unidade correta para as fórmulas.`,err:R`Se vier em rpm: ω = \f{2π n}{60}. Exemplo: 95,5 rpm ≈ 10 rad/s.`},
 {k:'ferr',t:'Duas fórmulas',eq:[R`I = \f{1}{2}MR^{2}`,R`K_{rot} = \f{1}{2}I ω^{2}`],why:R`O \h{½} do disco vem da integral (veja a dedução do disco). A energia de rotação tem a forma de ½mv² com m trocado por I e v por ω.`},
 {k:'conta',t:'(a) Momento de inércia',eq:[R`I = \f{1}{2}(4,0)(0,30)^{2} = \f{1}{2}(4,0)(0,09) = \f{0,36}{2}`,R`\h{I = 0,18 kg·m^{2}}`],why:R`0,30² = 0,09. Eleve só o raio ao quadrado, não a massa.`,err:R`Esquecer o quadrado (usar 0,30 em vez de 0,09).`},
 {k:'res',t:'(b) Energia cinética de rotação',eq:[R`K_{rot} = \f{1}{2}(0,18)(10)^{2} = \f{1}{2}(0,18)(100)`,R`\h{K_{rot} = 9,0 J}`],why:R`Aqui o ω também é elevado ao quadrado: 10² = 100.`,real:R`Volante de inércia de uma prensa guarda energia ½Iω² e a devolve no golpe. Dobrar ω quadruplica a energia guardada.`},
 {k:'conf',t:'Por outro caminho',eq:[R`v_{borda} = ωR = 10 · 0,30 = 3,0 m/s`,R`K = \f{1}{4}M v_{borda}^{2} = \f{1}{4}(4,0)(3,0)^{2} = 9,0 J ✓`],why:R`Com I = ½MR² resulta K = ¼M(ωR)². Mesmo valor por duas contas independentes. Para ter ideia: 9 J elevam 1 kg a cerca de 0,92 m.`}
]},
{g:'Lista 12',name:'Q03 · Esfera na rampa',badge:'Intermediário',bc:'b-int',rot:true,fig:FQ3,steps:[
 {k:'enun',t:'Enunciado',enun:R`Esfera sólida homogênea (\h{I = ⅖MR²}) parte do repouso no topo de uma rampa de \h{h = 1,2 m} e \h{rola sem deslizar} até a base. Por conservação de energia (potencial vira translação mais rotação), determine \h{v_{cm}} na base. Use \h{g = 9,8 m/s²}.`},
 {k:'dados',t:'Dados',eq:[R`h = 1,2 m,   g = 9,8 m/s^{2},   I = \f{2}{5}MR^{2}`,R`v_{0} = 0,   ω_{0} = 0   (parte do repouso)`,R`pede-se:  v_{cm} na base`],why:R`M e R não foram dados. Isso é pista: eles devem cancelar no final.`},
 {k:'ferr',t:'Ferramenta: energia',eq:[R`E_{inicial} = E_{final}`,R`M g h = \f{1}{2}M v^{2} + \f{1}{2}I ω^{2}`],why:R`Rolando sem deslizar, o ponto de contato fica parado por um instante: o atrito estático não realiza trabalho nem dissipa energia. A energia mecânica se conserva.`,err:R`Não use só ½Mv²: a esfera também gira, e girar custa energia.`},
 {k:'ferr',t:'Condição de rolamento',eq:[R`ω = \f{v}{R}`],why:R`Sem deslizar, o centro avança v = ωR. Isso une as duas energias em uma só variável, v.`,real:R`Pneu sem derrapar: a velocidade do carro é ω·R da roda.`},
 {k:'conta',t:'Energia de rotação em função de v',eq:[R`\f{1}{2}I ω^{2} = \f{1}{2} · \f{2}{5}MR^{2} · \f{v^{2}}{R^{2}} = \f{1}{5}M v^{2}`],why:R`O R² cancela: por isso o raio não precisa ser dado.`},
 {k:'conta',t:'Juntar as energias',eq:[R`\f{1}{2} + \f{1}{5} = \f{5}{10} + \f{2}{10} = \f{7}{10}`,R`M g h = \f{7}{10}M v^{2}`],why:R`M aparece em todos os termos e cancela.`},
 {k:'conta',t:'Isolar v',eq:[R`g h = \f{7}{10}v^{2}`,R`v^{2} = \f{10}{7}g h`,R`v = \r{\f{10 g h}{7}}`]},
 {k:'res',t:'Substituir os números',eq:[R`v^{2} = \f{10 · 9,8 · 1,2}{7} = \f{117,6}{7} = 16,8`,R`\h{v ≈ 4,1 m/s}`]},
 {k:'conf',t:'Compare com um bloco',eq:[R`bloco sem atrito:  v = \r{2gh} = \r{23,5} ≈ 4,85 m/s`,R`esfera:  4,1 m/s  <  4,85 m/s ✓`,R`parte da energia em rotação:  \f{\f{1}{5}}{\f{7}{10}} = \f{2}{7} ≈ 29%`],
  why:R`A esfera é mais lenta porque 2/7 da energia virou rotação. Se o resultado desse maior que 4,85, haveria erro.`,err:R`Erro nº 1: usar M g h = ½Mv² (dá 4,85 m/s). Erro nº 2: esquecer ω = v/R.`,real:R`Vale para bola de boliche, rolamento de esferas e rolos de esteira.`}
]}

LISTA.push(
{g:'Lista 12',name:'Q04 · Polia e torque',badge:'Intermediário',bc:'b-int',rot:true,fig:FQ4,steps:[
 {k:'enun',t:'Enunciado',enun:R`Polia em forma de disco sólido (\h{I = ½MR²}), \h{M = 2,0 kg}, \h{R = 0,10 m}, com um fio enrolado na borda. Uma tração constante \h{T = 5,0 N} age no fio e faz a polia girar do repouso, sem atrito no eixo. Pela 2ª Lei da rotação (\h{∑τ = Iα}), calcule: (a) α; (b) o tempo para atingir \h{ω = 20 rad/s}.`},
 {k:'dados',t:'Dados',eq:[R`M = 2,0 kg,   R = 0,10 m,   T = 5,0 N`,R`ω_{0} = 0,   ω = 20 rad/s`,R`pedem:  (a) α   (b) t`],why:R`Unidades já no SI.`},
 {k:'ferr',t:'Ferramenta: 2ª Lei na rotação',eq:[R`∑τ = I α`,R`τ = T · R`],why:R`O fio é tangente à borda, então a força é perpendicular ao raio e o braço é R. Só a tração gera torque: peso e normal passam pelo eixo (braço zero) e o eixo não tem atrito.`,err:R`τ = T·R só vale com o fio tangente. Em outro ângulo entra o seno.`},
 {k:'conta',t:'Momento de inércia da polia',eq:[R`I = \f{1}{2}MR^{2} = \f{1}{2}(2,0)(0,10)^{2} = \f{1}{2}(2,0)(0,010)`,R`I = 0,010 kg·m^{2}`]},
 {k:'conta',t:'Torque da tração',eq:[R`τ = T R = 5,0 · 0,10`,R`τ = 0,50 N·m`]},
 {k:'res',t:'(a) Aceleração angular',eq:[R`α = \f{τ}{I} = \f{0,50}{0,010}`,R`\h{α = 50 rad/s^{2}}`],why:R`É o análogo de a = F/m.`},
 {k:'res',t:'(b) Tempo para ω = 20 rad/s',eq:[R`ω = ω_{0} + α t`,R`t = \f{ω − ω_{0}}{α} = \f{20}{50}`,R`\h{t = 0,40 s}`],why:R`Movimento angular uniformemente variado: mesma forma de v = v₀ + at.`},
 {k:'conf',t:'Por energia',eq:[R`θ = \f{1}{2}α t^{2} = \f{1}{2}(50)(0,40)^{2} = 4,0 rad`,R`W = τ θ = 0,50 · 4,0 = 2,0 J`,R`K = \f{1}{2}I ω^{2} = \f{1}{2}(0,010)(20)^{2} = 2,0 J ✓`],why:R`O trabalho do torque é igual à energia cinética ganha. Dois caminhos, mesmo resultado.`,err:R`Usar I = MR² (anel) daria α = 25 rad/s² e t = 0,80 s. Confira sempre qual é o corpo.`,real:R`Guincho e polia de correia: τ/I diz o quão rápido o conjunto acelera.`}
]},
{g:'Lista 12',name:'Q05 · Cilindro: aceleração e atrito',badge:'Avançado',bc:'b-ava',rot:true,fig:FQ5,steps:[
 {k:'enun',t:'Enunciado',enun:R`Cilindro sólido homogêneo (\h{I = ½MR²}) rola sem deslizar numa rampa de inclinação \h{θ}. \h{Demonstre}, pela 2ª Lei (translação e rotação) e por \h{a_{cm} = Rα}, que \h{a_{cm} = ⅔ g senθ}. Depois avalie criticamente: qual o \h{μ_s mínimo} para o rolamento ocorrer de fato, com \h{θ = 30°}?`},
 {k:'dados',t:'Dados e incógnitas',eq:[R`I = \f{1}{2}MR^{2},   a_{cm} = Rα`,R`provar:  a_{cm} = \f{2}{3}g senθ`,R`calcular:  μ_{s,mín}  para θ = 30°`],why:R`Em demonstração, o resultado já vem escrito: o trabalho é chegar a ele sem pular passos.`},
 {k:'ferr',t:'Forças no cilindro',eq:[R`Mg (peso, no centro)`,R`N (normal, ⊥ à rampa)`,R`f (atrito estático, para cima da rampa)`],why:R`Sem atrito o cilindro deslizaria sem girar. É o atrito que cria o torque para girar. Ele aponta para cima da rampa porque se opõe ao deslizamento do ponto de contato.`,real:R`No gelo (pouco atrito) um cilindro desce deslizando, quase sem rolar.`},
 {k:'conta',t:'Translação e direção perpendicular',eq:[R`ao longo da rampa:  Mg senθ − f = M a_{cm}    (1)`,R`perpendicular:  N = Mg cosθ    (2)`],why:R`Ao longo da rampa o peso empurra para baixo e f freia. Na perpendicular não há aceleração, logo N equilibra a componente do peso.`},
 {k:'conta',t:'Rotação em torno do centro',eq:[R`f R = I α    (3)`],why:R`Só f gera torque em torno do centro: N e Mg passam por ele (braço zero).`},
 {k:'conta',t:'Condição de rolamento',eq:[R`α = \f{a_{cm}}{R}`,R`f R = \f{1}{2}MR^{2} · \f{a_{cm}}{R}`,R`f = \f{1}{2}M a_{cm}    (4)`],why:R`O R do lado esquerdo e um R do lado direito cancelam.`},
 {k:'res',t:'Juntar (4) em (1): a demonstração',eq:[R`Mg senθ − \f{1}{2}M a_{cm} = M a_{cm}`,R`g senθ = \f{3}{2}a_{cm}`,R`\h{a_{cm} = \f{2}{3} g senθ}  (c.q.d.)`],why:R`M cancela: a aceleração não depende de massa nem de raio. É ⅔ da de um bloco liso.`},
 {k:'conta',t:'Atrito necessário',eq:[R`f = \f{1}{2}M a_{cm} = \f{1}{2}M · \f{2}{3}g senθ`,R`f = \f{1}{3}Mg senθ`]},
 {k:'res',t:'Condição para não deslizar: f ≤ μ_{s} N',eq:[R`\f{1}{3}Mg senθ ≤ μ_{s} Mg cosθ`,R`μ_{s} ≥ \f{1}{3}tanθ`,R`θ = 30°:  μ_{s} ≥ \f{1}{3}(0,577) ≈ \h{0,19}`],why:R`tan 30° ≈ 0,577. Para θ = 30°, f = Mg/6 e N ≈ 0,866 Mg, e a razão f/N vale 0,19.`},
 {k:'conf',t:'Avaliação crítica',ul:[R`μ_{s,mín} \h{não depende de M nem de R}; cresce com a inclinação (tanθ).`,R`Se μ_{s} da superfície for \h{menor que 0,19}, o cilindro desliza e rola ao mesmo tempo, e a_{cm} passa a ser g(senθ − μ_{k} cosθ).`,R`Para um c qualquer: μ_{s} ≥ \f{c}{1 + c}tanθ. Em 30°: anel ≈ 0,29, cilindro ≈ 0,19, esfera ≈ 0,17.`],
  err:R`Usar f = μN como se sempre valesse. No rolamento puro, f é só o necessário (Mg/6 aqui); μN é o limite máximo.`,real:R`Madeira, borracha e concreto secos têm μ_{s} bem acima de 0,19, então o rolamento puro é plausível. Piso molhado ou oleoso pode não segurar.`}
]},
{g:'Lista 12',name:'Q06 · Anel, disco e esfera',badge:'Avançado',bc:'b-ava',rot:true,fig:FQ6,steps:[
 {k:'enun',t:'Enunciado',enun:R`Três corpos de mesma massa M e raio R (\h{anel I = MR²}, \h{disco I = ½MR²}, \h{esfera I = ⅖MR²}) são soltos juntos do repouso no topo de uma rampa e rolam sem deslizar. Por conservação de energia: (a) quem chega primeiro e por quê; (b) \h{v_{cm}} em função de \h{c}, com I = cMR²; (c) o efeito do \h{atrito de rolamento} real na análise e na ordem de chegada.`},
 {k:'dados',t:'Dados',eq:[R`mesmos M, R e altura h; partem do repouso`,R`anel c = 1,   disco c = \f{1}{2},   esfera c = \f{2}{5}`],why:R`O coeficiente c resume a forma: quanto maior, mais massa longe do eixo.`},
 {k:'ferr',t:'Energia com I = cMR²',eq:[R`Mgh = \f{1}{2}M v^{2} + \f{1}{2}(c M R^{2})\p{\f{v}{R}}^{2}`],why:R`Mesmo caminho da Q03, agora com c genérico. Usamos ω = v/R.`},

function slide(it,s,idx){
  let side='';

  }
  let m='';
  if(it.rot&&ROT.includes(s.k)){m+='<div class="rot">'+ROT.map((r,k)=>'<span data-n="'+(k+1)+'"'+(s.k===r?' class="on"':'')+'>'+ROTN[k]+'</span>').join('')+'</div>'}
  const lab=s.tag||TAG[s.k];const same=lab&&s.t===lab.split(' · ').pop();
  m+='<h3 class="st">'+(lab?'<span style="color:var(--acc)">'+lab+'</span>'+(same?'':' · '):'')+(same?'':fx(s.t))+'</h3>';
  if(s.enun)m+='<div class="enun">'+fx(s.enun)+'</div>';
  if(s.widget)m+='<div class="wd" data-w="'+s.widget+'"></div>';
  if(s.eq)m+='<div class="eq'+(s.k==='res'&&it.g==='Lista 12'?'':'')+'">'+lines(s.eq)+'</div>';
  if(s.ul)m+='<ul class="lst">'+s.ul.map(x=>'<li>'+fx(x)+'</li>').join('')+'</ul>';

  COL.forEach(([key,lab])=>{if(s[key])m+='<div class="co '+key+'"><b>'+(key==='tip'&&it.auto?'Na lista':lab)+'</b>'+fx(s[key])+'</div>'});

function overflow(sl){
  if(sl.scrollHeight>sl.clientHeight+1)return true;
  return [...sl.querySelectorAll('.eq')].some(e=>e.scrollWidth>e.clientWidth+1);

function fit(){
  const sl=$('stage').firstElementChild;if(!sl)return;
  const min=(innerWidth<760||innerHeight>innerWidth)?0.88:(innerHeight<520?0.8:0.5);

  for(let k=0;k<n;k++){const x=document.createElement('button');x.className=k<i?'on':k===i?'cur':'';x.setAttribute('aria-label','Ir ao slide '+(k+1));x.onclick=e=>{e.stopPropagation();i=k;draw()};$('dots').appendChild(x)}
  $('stage').innerHTML=slide(it,it.steps[i],i);
  cancelAnimationFrame(RAF);const wd=$('stage').querySelector('.wd');if(wd)(WID[wd.dataset.w]||(()=>{}))(wd);
  $('prev').disabled=(d===0&&i===0);
  const last=i===n-1;
  const nl=!last?'Próximo':(d<ITEMS.length-1?'Próximo: '+ITEMS[d+1].name.split(' · ')[0]:'Recomeçar');$('next').title=nl;$('next').setAttribute('aria-label',nl);
  requestAnimationFrame(fit);
  try{history.replaceState(null,'','#'+d+'-'+i)}catch(e){}
}
function go(dir){
  try{navigator.vibrate&&navigator.vibrate(6)}catch(x){}
  const n=ITEMS[d].steps.length;
  if(dir>0){if(i<n-1)i++;else if(d<ITEMS.length-1){d++;i=0}else{d=0;i=0}}
  else{if(i>0)i--;else if(d>0){d--;i=ITEMS[d].steps.length-1}}
  draw();
}
$('next').onclick=()=>go(1);$('prev').onclick=()=>go(-1);
/* toque/clique no slide: 1/3 esquerdo volta, o resto avança; arrastar também navega */
let p0=null;
const st=$('stage');
st.addEventListener('pointerdown',e=>{p0=(e.target.closest&&e.target.closest('.wd'))?null:{x:e.clientX,y:e.clientY}});
st.addEventListener('pointerup',e=>{
  if(!p0)return;if(e.target.closest&&e.target.closest('.wd')){p0=null;return}const dx=e.clientX-p0.x,dy=e.clientY-p0.y;p0=null;
  if(window.getSelection&&String(getSelection()))return;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){go(dx<0?1:-1);return}
  if(Math.abs(dx)<12&&Math.abs(dy)<12){const r=st.getBoundingClientRect();go(e.clientX-r.left<r.width*0.3?-1:1)}
});
st.addEventListener('pointercancel',()=>{p0=null});
document.addEventListener('keydown',e=>{
  if(!$('idx').hidden){if(e.key==='Escape')idx(false);return}
  if(e.target&&e.target.tagName==='INPUT')return;
  const k=e.key;
  if(k==='ArrowRight'||k==='ArrowDown'||k==='PageDown'||k===' '||k==='Enter'){e.preventDefault();go(1)}
  else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'||k==='Backspace'){e.preventDefault();go(-1)}
  else if(k==='Home'){i=0;draw()}
  else if(k==='End'){i=ITEMS[d].steps.length-1;draw()}
  else if(k==='f'||k==='F')$('fs').click();
  else if(k==='i'||k==='I'||k==='m'||k==='M')idx(true);
  else if(k==='Escape'&&document.body.classList.contains('pres'))pres(false);
});
/* índice */
function idx(on){
  const o=$('idx');o.hidden=!on;if(!on)return;
  let h='<button class="x" id="xc">Fechar</button>',g='';
  ITEMS.forEach((it,k)=>{
    if(it.g!==g){g=it.g;h+='<h3>'+(g==='Lista 12'?'Lista 12 resolvida':'Deduções (base teórica)')+'</h3><div class="g">'}
    h+='<button data-k="'+k+'" class="'+(k===d?'cur':'')+'">'+it.name+'</button>';
    if(!ITEMS[k+1]||ITEMS[k+1].g!==g)h+='</div>';
  });
  $('panel').innerHTML=h;
  $('panel').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{d=+b.dataset.k;i=0;idx(false);draw()});
  $('xc').onclick=()=>idx(false);
}
$('bi').onclick=()=>idx(true);
$('idx').addEventListener('click',e=>{if(e.target.id==='idx')idx(false)});
/* tema */
const root=document.documentElement,mq=matchMedia('(prefers-color-scheme: dark)');
const eff=()=>root.dataset.theme||(mq.matches?'dark':'light');
function setT(t){root.dataset.theme=t;$('theme').innerHTML=t==='dark'?'<span class="ic">☀</span><span class="lb"> Claro</span>':'<span class="ic">☾</span><span class="lb"> Escuro</span>';try{localStorage.setItem('tema',t)}catch(e){}}
let sv=null;try{sv=localStorage.getItem('tema')}catch(e){}
setT(sv==='dark'||sv==='light'?sv:eff());
$('theme').onclick=()=>setT(eff()==='dark'?'light':'dark');
/* tela cheia / modo apresentação */
function pres(on){document.body.classList.toggle('pres',on);$('fs').innerHTML=on?'<span class="ic">✕</span><span class="lb"> Sair da tela cheia</span>':'<span class="ic">⛶</span><span class="lb"> Tela cheia</span>';
  try{if(on&&navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{})}catch(x){}
  try{if(on&&!document.fullscreenElement){const p=document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}else if(!on&&document.fullscreenElement)document.exitFullscreen()}catch(e){}
  setTimeout(fit,60)}
$('fs').onclick=()=>pres(!document.body.classList.contains('pres'));
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('pres'))pres(false)});
addEventListener('resize',fit);
pres(false);
/* abrir onde parou: #item-slide */
const m=location.hash.match(/^#(\d+)-(\d+)$/);
if(m&&ITEMS[+m[1]]&&ITEMS[+m[1]].steps[+m[2]]){d=+m[1];i=+m[2]}
draw();
</script>
</body>
